<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<style>
  :root {
    --bg1: #111827; --bg2: #3b0a1a; --glow: rgba(251, 113, 133, .30);
    --fg: #ffffff; --muted: rgba(255, 255, 255, .68); --accent: #fb7185; --track: rgba(255, 255, 255, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 4px; }
  .card {
    position: relative; overflow: hidden; height: calc(100vh - 8px); min-height: 210px; max-height: 300px;
    border-radius: 18px; padding: 14px 18px; color: var(--fg);
    background: radial-gradient(120% 90% at 100% 0%, var(--glow), transparent 55%), linear-gradient(145deg, var(--bg1), var(--bg2));
    box-shadow: 0 6px 24px rgba(15, 23, 42, .25);
    display: flex; flex-direction: column; gap: 10px;
  }
  .modes { display: flex; gap: 4px; background: rgba(255, 255, 255, .08); border-radius: 999px; padding: 3px; }
  .modes button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
                  padding: 5px 6px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .modes button.on { background: var(--fg); color: #111827; }
  .main { flex: 1; display: flex; align-items: center; gap: 16px; min-height: 0; }
  .ring { position: relative; width: clamp(96px, 34vw, 132px); aspect-ratio: 1; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: var(--track); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(22px, 8.5vw, 32px); font-weight: 800;
             letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .msg { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .msg b { color: var(--fg); }
  .btns { display: flex; gap: 6px; }
  .btns button { border: 0; font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .go { background: var(--accent); color: #111827; }
  .reset { background: rgba(255, 255, 255, .12); color: var(--fg); }
  .count { font-size: 12px; color: var(--muted); }
  @media (max-width: 300px) { .main { flex-direction: column; gap: 6px; } .ring { width: 92px; } .side { align-items: center; text-align: center; gap: 6px; } .msg, .count { display: none; } .modes button { font-size: 11px; padding: 5px 4px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="modes" role="tablist">
      <button data-m="focus" class="on">Enfoque 25</button>
      <button data-m="short">Pausa 5</button>
      <button data-m="long">Pausa 15</button>
    </div>
    <div class="main">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg>
        <div class="t" id="t">25:00</div>
      </div>
      <div class="side">
        <div class="msg" id="msg"><b>Una sola tarea.</b> Celular lejos.</div>
        <div class="btns">
          <button class="go" id="go">▶ Empezar</button>
          <button class="reset" id="reset" title="Reiniciar">↺</button>
        </div>
        <div class="count" id="count">🍅 0 hoy</div>
      </div>
    </div>
  </div>
<script>
  var DUR = { focus: 25 * 60000, short: 5 * 60000, long: 15 * 60000 };
  var MSG = {
    focus: '<b>Una sola tarea.</b> Celular lejos.',
    short: '<b>Pausa corta.</b> Levántate y toma agua.',
    long: '<b>Pausa larga.</b> Camina 15 minutos.'
  };
  var C = 2 * Math.PI * 52;
  var arc = document.getElementById('arc');
  arc.style.strokeDasharray = C;

  // Estado guardado (si el navegador lo permite) para no perder el tiempo al cambiar de página
  var mem = {};
  function load() {
    try { var s = localStorage.getItem('gus-pomo'); if (s) return JSON.parse(s); } catch (e) {}
    return mem.s || null;
  }
  function save(s) {
    mem.s = s;
    try { localStorage.setItem('gus-pomo', JSON.stringify(s)); } catch (e) {}
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  var st = load() || { mode: 'focus', running: false, endAt: 0, left: DUR.focus, count: 0, day: today(), streak: 0 };
  if (st.day !== today()) { st.count = 0; st.day = today(); }

  function remaining() { return st.running ? Math.max(0, st.endAt - Date.now()) : st.left; }

  function fmt(ms) {
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .32);
      });
    } catch (e) {}
  }

  function setMode(m) {
    st.mode = m; st.running = false; st.left = DUR[m]; st.endAt = 0;
    save(st); render();
  }

  function finish() {
    beep();
    if (st.mode === 'focus') {
      st.count++; st.streak = (st.streak || 0) + 1;
      var next = st.streak % 4 === 0 ? 'long' : 'short';
      setMode(next);
      document.getElementById('msg').innerHTML = '<b>¡Pomodoro completo!</b> Ahora una pausa.';
    } else {
      setMode('focus');
      document.getElementById('msg').innerHTML = '<b>De vuelta.</b> Abre tu tarea de hoy.';
    }
  }

  function render() {
    var ms = remaining();
    document.getElementById('t').textContent = fmt(ms);
    arc.style.strokeDashoffset = C * (1 - ms / DUR[st.mode]);
    var btns = document.querySelectorAll('.modes button');
    for (var i = 0; i < btns.length; i++) btns[i].className = btns[i].getAttribute('data-m') === st.mode ? 'on' : '';
    document.getElementById('go').textContent = st.running ? '⏸ Pausar' : (ms < DUR[st.mode] ? '▶ Seguir' : '▶ Empezar');
    document.getElementById('count').textContent = '🍅 ' + st.count + ' hoy';
  }

  document.getElementById('go').onclick = function () {
    if (st.running) { st.left = remaining(); st.running = false; }
    else { st.endAt = Date.now() + st.left; st.running = true; document.getElementById('msg').innerHTML = MSG[st.mode]; }
    save(st); render();
  };
  document.getElementById('reset').onclick = function () { setMode(st.mode); document.getElementById('msg').innerHTML = MSG[st.mode]; };
  var mb = document.querySelectorAll('.modes button');
  for (var i = 0; i < mb.length; i++) mb[i].onclick = function () { setMode(this.getAttribute('data-m')); document.getElementById('msg').innerHTML = MSG[st.mode]; };

  setInterval(function () {
    if (st.running && remaining() <= 0) finish(); else render();
  }, 500);
  document.getElementById('msg').innerHTML = MSG[st.mode];
  render();
</script>
</body>
</html>
