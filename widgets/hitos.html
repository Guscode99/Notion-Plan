<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Próximos hitos</title>
<style>
  :root {
    --bg1: #111827; --bg2: #052e2b; --glow: rgba(52, 211, 153, .26);
    --fg: #ffffff; --muted: rgba(255, 255, 255, .68); --accent: #34d399; --warn: #fbbf24; --hot: #fb7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 4px; }
  .card {
    position: relative; overflow: hidden; height: calc(100vh - 8px); min-height: 210px; max-height: 300px;
    border-radius: 18px; padding: 16px 18px; color: var(--fg);
    background: radial-gradient(120% 90% at 100% 0%, var(--glow), transparent 55%), linear-gradient(145deg, var(--bg1), var(--bg2));
    box-shadow: 0 6px 24px rgba(15, 23, 42, .25);
    display: flex; flex-direction: column; gap: 10px;
  }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .hero { display: flex; align-items: center; gap: 14px; }
  .num { font-size: clamp(40px, 17vw, 64px); font-weight: 800; letter-spacing: -.04em; line-height: .9; font-variant-numeric: tabular-nums; }
  .num small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-top: 4px; text-align: center; }
  .what { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .when { font-size: 12px; color: var(--muted); margin-top: 3px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 10px; }
  li { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255, 255, 255, .9); }
  li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hot { color: var(--hot) !important; font-weight: 700; }
  .warn { color: var(--warn) !important; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">⏳ Lo más urgente</div>
    <div class="hero">
      <div class="num" id="num">–<small>días</small></div>
      <div>
        <div class="what" id="what">Sin entregas pendientes</div>
        <div class="when" id="when"></div>
      </div>
    </div>
    <ul id="list"></ul>
  </div>
<script>
  // Fechas del sílabo del Seminario de Investigación 2 (2026-2). Claude actualiza esta lista cuando llegan fechas nuevas.
  var EVENTOS = [
    { d: '2026-10-15T19:00', t: '🎓 Clase S5 · Seminario 2', k: 'clase' },
    { d: '2026-10-18T23:59', t: '📝 2.ª entrega escrita (15%)', k: 'entrega' },
    { d: '2026-10-29T19:00', t: '🎓 Clase S6 · Seminario 2', k: 'clase' },
    { d: '2026-11-12T19:00', t: '🎓 Clase S7 · Seminario 2', k: 'clase' },
    { d: '2026-11-22T23:59', t: '📦 Entrega final de la tesis (40%)', k: 'entrega' },
    { d: '2026-11-26T19:00', t: '🎓 Clase S8 · Seminario 2 (última)', k: 'clase' }
  ];

  function parse(s) {
    var a = s.split('T'), d = a[0].split('-'), h = (a[1] || '00:00').split(':');
    return new Date(+d[0], +d[1] - 1, +d[2], +h[0], +h[1]);
  }
  function dias(f, now) {
    var a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var b = new Date(f.getFullYear(), f.getMonth(), f.getDate());
    return Math.round((b - a) / 86400000);
  }
  function enDias(n) { return n === 0 ? 'hoy' : (n === 1 ? 'mañana' : 'en ' + n + ' días'); }
  function fecha(f) {
    try { var x = f.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' }); return x.charAt(0).toUpperCase() + x.slice(1); }
    catch (e) { return f.toDateString(); }
  }

  function render() {
    var now = new Date();
    var futuros = EVENTOS.map(function (e) { return { f: parse(e.d), t: e.t, k: e.k }; })
                         .filter(function (e) { return e.f > now; })
                         .sort(function (a, b) { return a.f - b.f; });
    var entrega = futuros.filter(function (e) { return e.k === 'entrega'; })[0];
    var num = document.getElementById('num');
    if (entrega) {
      var n = dias(entrega.f, now);
      num.innerHTML = n + '<small>' + (n === 1 ? 'día' : 'días') + '</small>';
      num.style.color = n <= 3 ? 'var(--hot)' : (n <= 7 ? 'var(--warn)' : 'var(--fg)');
      document.getElementById('what').textContent = entrega.t;
      document.getElementById('when').textContent = fecha(entrega.f);
    } else {
      num.innerHTML = '✓<small>al día</small>';
      document.getElementById('what').textContent = 'Sin entregas pendientes';
      document.getElementById('when').textContent = 'Pídele a Claude que agregue tus nuevas fechas';
    }
    var html = '';
    futuros.filter(function (e) { return e !== entrega; }).slice(0, 3).forEach(function (e) {
      var n = dias(e.f, now);
      var cls = n <= 1 ? 'hot' : (n <= 7 ? 'warn' : '');
      html += '<li><span>' + e.t + '</span><span class="' + cls + '">' + enDias(n) + '</span></li>';
    });
    document.getElementById('list').innerHTML = html;
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
