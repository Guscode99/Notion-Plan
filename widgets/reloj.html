<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloj</title>
<style>
  :root {
    --bg1: #111827; --bg2: #1e1b4b; --glow: rgba(251, 191, 36, .28);
    --fg: #ffffff; --muted: rgba(255, 255, 255, .68); --accent: #fbbf24; --track: rgba(255, 255, 255, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 4px; }
  .card {
    position: relative; overflow: hidden; height: calc(100vh - 8px); min-height: 210px; max-height: 300px;
    border-radius: 18px; padding: 18px 20px; color: var(--fg);
    background: radial-gradient(120% 90% at 100% 0%, var(--glow), transparent 55%), linear-gradient(145deg, var(--bg1), var(--bg2));
    box-shadow: 0 6px 24px rgba(15, 23, 42, .25);
    display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hello { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
          border: 1px solid rgba(251, 191, 36, .45); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
  .time { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  .hm { font-size: clamp(40px, 19vw, 72px); font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .ampm { font-size: clamp(13px, 5vw, 18px); font-weight: 700; color: var(--muted); }
  .date { font-size: 14px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 300px) { .long { display: none; } }
  .prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; gap: 8px; }
  .prog-label b { color: var(--fg); font-weight: 700; }
  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #f59e0b, #fde68a); transition: width .6s ease; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="hello" id="hello">Hola, Carlos</div>
      <div class="chip">Gus OS</div>
    </div>
    <div>
      <div class="time"><span class="hm" id="hm">--:--</span><span class="ampm" id="ampm"></span></div>
      <div class="date" id="date"></div>
    </div>
    <div>
      <div class="prog-label"><span>Seminario 2<span class="long"> · avance del ciclo</span></span><b id="pct">–</b></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
<script>
  // Sesiones del Seminario de Investigación 2 (sílabo 2026-2)
  var SESIONES = ['2026-08-20', '2026-09-03', '2026-09-17', '2026-10-01', '2026-10-15', '2026-10-29', '2026-11-12', '2026-11-26'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var saludo = h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches');
    document.getElementById('hello').textContent = saludo + ', Carlos';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    document.getElementById('hm').textContent = h12 + ':' + pad(now.getMinutes());
    document.getElementById('ampm').textContent = h < 12 ? 'a. m.' : 'p. m.';
    var fecha;
    try {
      fecha = now.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {
      fecha = now.toDateString();
    }
    document.getElementById('date').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);

    var hechas = 0;
    for (var i = 0; i < SESIONES.length; i++) {
      var p = SESIONES[i].split('-');
      var fin = new Date(+p[0], +p[1] - 1, +p[2], 21, 30);
      if (now >= fin) hechas++;
    }
    var pct = Math.round(hechas / SESIONES.length * 100);
    document.getElementById('pct').textContent = hechas + '/' + SESIONES.length + ' sesiones';
    document.getElementById('bar').style.width = pct + '%';
  }

  tick();
  setInterval(tick, 15000);
</script>
</body>
</html>
