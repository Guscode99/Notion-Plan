<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus</title>
<style>
  :root {
    --page: #191919; --card: #202326; --card2: #262a2e; --edge: rgba(255,255,255,.08);
    --ink: rgba(255,255,255,.9); --muted: rgba(255,255,255,.52); --line: rgba(255,255,255,.07);
    --blue: #8ec5ff; --navy1: #142338; --navy2: #23466f;
    --hot: #ff7b72; --warn: #f0a43a; --ok: #57c78a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Fondo igual al de Notion en modo oscuro: el marco del embed nunca se ve gris */
  html, body { height: 100%; background: var(--page); }
  body { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); overflow: hidden; }

  /* El panel llena todo el marco que Notion le dé (por defecto unos 750 × 560 px) */
  .wrap { height: 100vh; padding: 4px; display: grid; gap: 10px;
          grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 1.12fr);
          grid-template-areas: "hello pomo" "agenda cal"; }
  .card { border-radius: 16px; padding: clamp(12px, 2.6vh, 20px) clamp(14px, 2.4vw, 22px); min-width: 0; min-height: 0;
          display: flex; flex-direction: column; justify-content: space-between; gap: clamp(8px, 1.8vh, 14px);
          background: var(--card); border: 1px solid var(--edge); }
  .lbl { font-size: clamp(9.5px, 1.9vh, 11.5px); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); }

  /* Saludo + próximo hito + ciclo */
  .hello { grid-area: hello; }
  .greet { font-size: clamp(15px, 3.7vh, 23px); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date { font-size: clamp(11.5px, 2.3vh, 14px); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hito { display: flex; align-items: center; gap: clamp(12px, 2vw, 18px); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: clamp(8px, 1.8vh, 14px) clamp(12px, 2vw, 16px); }
  .num { font-size: clamp(32px, 9vh, 58px); font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
  .num small { display: block; font-size: clamp(10px, 1.9vh, 12px); font-weight: 700; color: var(--muted); margin-top: 3px; letter-spacing: 0; }
  .hito > div:last-child { min-width: 0; }
  .what { font-size: clamp(13.5px, 3vh, 18px); font-weight: 700; margin-top: 2px; line-height: 1.25; }
  .when { font-size: clamp(11.5px, 2.3vh, 14px); color: var(--muted); margin-top: 2px; }
  .cycle { display: flex; align-items: center; gap: 10px; font-size: clamp(10.5px, 2vh, 12.5px); color: var(--muted); white-space: nowrap; }
  .bar { flex: 1; height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }

  /* Pomodoro */
  .pomo { grid-area: pomo; background: linear-gradient(150deg, var(--navy1), var(--navy2)); color: #fff; align-items: stretch; }
  .modes { display: flex; gap: 3px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
  .modes button { flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.75); font: inherit; font-size: clamp(11px, 2.1vh, 13px); font-weight: 600; padding: clamp(4px, .9vh, 7px) 2px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .modes button.on { background: #fff; color: #142338; }
  .main { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2.4vw, 22px); }
  .ring { position: relative; width: clamp(76px, 24vh, 142px); aspect-ratio: 1; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: rgba(255,255,255,.16); }
  .ring .fg { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(19px, 5vh, 30px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .btns { display: flex; gap: 6px; }
  .btns button { border: 0; font: inherit; font-size: clamp(12px, 2.3vh, 14px); font-weight: 700; border-radius: 10px; padding: clamp(7px, 1.4vh, 10px) clamp(9px, 1.4vw, 13px); cursor: pointer; white-space: nowrap; }
  .go { background: var(--blue); color: #142338; }
  .reset { background: rgba(255,255,255,.14); color: #fff; }
  .count { font-size: clamp(11px, 2.1vh, 13px); color: rgba(255,255,255,.72); }
  .msg { font-size: clamp(11px, 2.2vh, 13.5px); color: rgba(255,255,255,.8); line-height: 1.35; text-align: center; }
  .msg b { color: #fff; }

  /* Lo que viene */
  .agenda { grid-area: agenda; justify-content: flex-start; }
  .agenda ul { list-style: none; display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; min-height: 0; }
  .agenda li { display: flex; align-items: center; gap: 10px; padding: clamp(4px, 1vh, 8px) 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .agenda li:last-child { border-bottom: 0; }
  .agenda .ic { font-size: clamp(13px, 2.6vh, 16px); flex: none; }
  .agenda .tx { flex: 1; min-width: 0; }
  .agenda .tt { font-size: clamp(12.5px, 2.5vh, 15px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda .dd { font-size: clamp(10.5px, 2vh, 12.5px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { flex: none; font-size: clamp(10.5px, 2vh, 12.5px); font-weight: 700; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.08); color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.hot { background: rgba(255,123,114,.16); color: var(--hot); }
  .chip.warn { background: rgba(240,164,58,.16); color: var(--warn); }

  /* Próximas dos semanas */
  .cal { grid-area: cal; justify-content: flex-start; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto 1fr 1fr; gap: clamp(4px, .9vh, 7px); min-height: 0; }
  .wd { text-align: center; font-size: clamp(9.5px, 1.8vh, 11px); font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .day { border-radius: 10px; background: var(--card2); border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 0; }
  .day b { font-size: clamp(12px, 2.6vh, 16px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .day.past { opacity: .35; }
  .day.today { border-color: var(--blue); }
  .day.today b { color: var(--blue); }
  .dots { display: flex; gap: 3px; height: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.clase { background: var(--blue); }
  .dot.entrega { background: var(--hot); }
  .legend { display: flex; gap: 14px; font-size: clamp(10px, 1.9vh, 12px); color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* Marco bajo (si arrastras el borde del embed hacia arriba): solo la franja de arriba */
  @media (max-height: 300px) {
    .wrap { grid-template-rows: minmax(0, 1fr); grid-template-areas: "hello pomo"; }
    .agenda, .cal { display: none; }
    .main { justify-content: flex-start; }
    .msg { text-align: left; }
  }
  /* Columna angosta o celular: una tarjeta debajo de otra */
  @media (max-width: 560px) {
    body { overflow: auto; }
    .wrap { height: auto; grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "hello" "pomo" "agenda" "cal"; }
    .cal .grid { min-height: 150px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card hello">
    <div>
      <div class="greet" id="greet">Hola, Carlos.</div>
      <div class="date" id="date"></div>
    </div>
    <div class="hito">
      <div class="num" id="num">–<small>días</small></div>
      <div>
        <div class="lbl">Próximo hito</div>
        <div class="what" id="what">Sin entregas pendientes</div>
        <div class="when" id="when"></div>
      </div>
    </div>
    <div class="cycle"><span id="week">Ciclo</span><div class="bar"><i id="cyc" style="width:0%"></i></div><span id="left"></span></div>
  </section>

  <section class="card pomo">
    <div class="modes">
      <button data-m="focus" class="on">Enfoque 25</button>
      <button data-m="short">Pausa 5</button>
      <button data-m="long">Pausa 15</button>
    </div>
    <div class="main">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg>
        <div class="t" id="t">25:00</div>
      </div>
      <div class="side">
        <div class="btns">
          <button class="go" id="go">▶ Empezar</button>
          <button class="reset" id="reset" title="Reiniciar">↺</button>
        </div>
        <div class="count" id="count">🍅 0 hoy</div>
      </div>
    </div>
    <div class="msg" id="msg"><b>Una sola tarea.</b> Celular lejos.</div>
  </section>

  <section class="card agenda">
    <div class="lbl">🗓️ Lo que viene</div>
    <ul id="agenda"></ul>
  </section>

  <section class="card cal">
    <div class="lbl">📆 Tus próximas 2 semanas</div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i class="dot clase"></i>Clase</span><span><i class="dot entrega"></i>Entrega</span></div>
  </section>
</div>
<script>
  // ---------- Calendario del ciclo (Claude actualiza estas fechas) ----------
  var CICLO = { nombre: '2026-2', inicio: '2026-08-17', semanas: 16 };
  var EVENTOS = [
    { d: '2026-10-15T19:00', t: 'Clase S5 · Seminario 2', k: 'clase' },
    { d: '2026-10-17T23:59', t: 'Aplicar observaciones de los jurados', k: 'tarea' },
    { d: '2026-10-18T23:59', t: '2.ª entrega escrita', k: 'entrega', peso: '15%' },
    { d: '2026-10-29T19:00', t: 'Clase S6 · Seminario 2', k: 'clase' },
    { d: '2026-11-12T19:00', t: 'Clase S7 · Seminario 2', k: 'clase' },
    { d: '2026-11-22T23:59', t: 'Entrega final de la tesis', k: 'entrega', peso: '40%' },
    { d: '2026-11-26T19:00', t: 'Clase S8 · Seminario 2 (última)', k: 'clase' }
  ];
  var ICON = { clase: '🎓', entrega: '📝', tarea: '🎯' };

  function parse(s) {
    var a = s.split('T'), d = a[0].split('-'), h = (a[1] || '00:00').split(':');
    return new Date(+d[0], +d[1] - 1, +d[2], +h[0], +h[1]);
  }
  function startOf(f) { return new Date(f.getFullYear(), f.getMonth(), f.getDate()); }
  function dayDiff(f, now) { return Math.round((startOf(f) - startOf(now)) / 86400000); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtDate(f, opts) { try { return cap(f.toLocaleDateString('es-PE', opts)); } catch (e) { return f.toDateString(); } }
  function fmtHour(f) {
    if (f.getHours() === 23 && f.getMinutes() === 59) return 'hasta las 11:59 p. m.';
    var h = f.getHours(), m = f.getMinutes(), pm = h >= 12; h = h % 12 || 12;
    return h + ':' + (m < 10 ? '0' : '') + m + (pm ? ' p. m.' : ' a. m.');
  }
  function enDias(n) { return n === 0 ? 'hoy' : (n === 1 ? 'mañana' : 'en ' + n + ' días'); }

  function renderHello() {
    var now = new Date(), h = now.getHours();
    var saludo = h < 12 ? '☀️ Buenos días' : (h < 19 ? '🌤️ Buenas tardes' : '🌙 Buenas noches');
    document.getElementById('greet').textContent = saludo + ', Carlos.';

    var ini = parse(CICLO.inicio), d = Math.max(0, dayDiff(now, ini));
    var sem = Math.min(CICLO.semanas, Math.floor(d / 7) + 1);
    document.getElementById('date').textContent = fmtDate(now, { weekday: 'long', day: 'numeric', month: 'long' }) + ' · semana ' + sem + ' del ciclo';
    document.getElementById('week').textContent = 'Ciclo ' + CICLO.nombre;
    document.getElementById('cyc').style.width = Math.round(sem / CICLO.semanas * 100) + '%';
    document.getElementById('left').textContent = sem + '/' + CICLO.semanas + ' sem.';

    var fut = EVENTOS.map(function (e) { return { f: parse(e.d), t: e.t, k: e.k, peso: e.peso }; })
                     .filter(function (e) { return e.f > now; })
                     .sort(function (a, b) { return a.f - b.f; });
    var ent = fut.filter(function (e) { return e.k === 'entrega'; })[0];
    var num = document.getElementById('num');
    if (ent) {
      var n = dayDiff(ent.f, now);
      num.innerHTML = n + '<small>' + (n === 1 ? 'día' : 'días') + '</small>';
      num.style.color = n <= 3 ? 'var(--hot)' : (n <= 7 ? 'var(--warn)' : 'var(--ok)');
      document.getElementById('what').textContent = ent.t + (ent.peso ? ' · ' + ent.peso + ' de la nota' : '');
      document.getElementById('when').textContent = fmtDate(ent.f, { weekday: 'long', day: 'numeric', month: 'long' });
    } else {
      num.innerHTML = '✓<small>al día</small>';
      document.getElementById('what').textContent = 'Sin entregas pendientes';
      document.getElementById('when').textContent = 'Pídele a Claude que agregue tus nuevas fechas';
    }

    // Lo que viene (hasta 5)
    var li = '';
    fut.slice(0, 5).forEach(function (e) {
      var n = dayDiff(e.f, now), cls = n <= 1 ? 'hot' : (n <= 7 ? 'warn' : '');
      li += '<li><span class="ic">' + ICON[e.k] + '</span><span class="tx"><div class="tt">' + e.t + '</div>' +
            '<div class="dd">' + fmtDate(e.f, { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + fmtHour(e.f) + '</div></span>' +
            '<span class="chip ' + cls + '">' + enDias(n) + '</span></li>';
    });
    document.getElementById('agenda').innerHTML = li || '<li><span class="tx"><div class="tt">Sin fechas próximas</div></span></li>';

    // Próximas 2 semanas, desde el lunes de esta semana
    var t0 = startOf(now), lun = new Date(t0); lun.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));
    var html = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < 14; i++) {
      var dia = new Date(lun); dia.setDate(lun.getDate() + i);
      var evs = EVENTOS.filter(function (e) { return dayDiff(parse(e.d), dia) === 0 && e.k !== 'tarea'; });
      var cls = 'day' + (dayDiff(dia, now) < 0 ? ' past' : '') + (dayDiff(dia, now) === 0 ? ' today' : '');
      var tip = evs.map(function (e) { return e.t; }).join(' · ');
      html += '<div class="' + cls + '" title="' + tip + '"><b>' + dia.getDate() + '</b><span class="dots">' +
              evs.map(function (e) { return '<i class="dot ' + e.k + '"></i>'; }).join('') + '</span></div>';
    }
    document.getElementById('grid').innerHTML = html;
  }

  // ---------- Pomodoro 25/5/15 ----------
  var DUR = { focus: 25 * 60000, short: 5 * 60000, long: 15 * 60000 };
  var MSG = { focus: '<b>Una sola tarea.</b> Celular lejos.', short: '<b>Pausa corta.</b> Levántate y toma agua.', long: '<b>Pausa larga.</b> Camina 15 minutos.' };
  var C = 2 * Math.PI * 52, arc = document.getElementById('arc');
  arc.style.strokeDasharray = C;
  var mem = {};
  function load() { try { var s = localStorage.getItem('gus-pomo'); if (s) return JSON.parse(s); } catch (e) {} return mem.s || null; }
  function save(s) { mem.s = s; try { localStorage.setItem('gus-pomo', JSON.stringify(s)); } catch (e) {} }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  var st = load() || { mode: 'focus', running: false, endAt: 0, left: DUR.focus, count: 0, day: today(), streak: 0 };
  if (st.day !== today()) { st.count = 0; st.day = today(); }
  function remaining() { return st.running ? Math.max(0, st.endAt - Date.now()) : st.left; }
  function fmt(ms) { var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .32);
      });
    } catch (e) {}
  }
  function setMode(m) { st.mode = m; st.running = false; st.left = DUR[m]; st.endAt = 0; save(st); render(); }
  function finish() {
    beep();
    if (st.mode === 'focus') {
      st.count++; st.streak = (st.streak || 0) + 1;
      setMode(st.streak % 4 === 0 ? 'long' : 'short');
      document.getElementById('msg').innerHTML = '<b>Pomodoro completo.</b> Ahora una pausa.';
    } else {
      setMode('focus');
      document.getElementById('msg').innerHTML = '<b>De vuelta.</b> Abre tu tarea de hoy.';
    }
  }
  function render() {
    var ms = remaining();
    document.getElementById('t').textContent = fmt(ms);
    arc.style.strokeDashoffset = C * (1 - ms / DUR[st.mode]);
    var b = document.querySelectorAll('.modes button');
    for (var i = 0; i < b.length; i++) b[i].className = b[i].getAttribute('data-m') === st.mode ? 'on' : '';
    document.getElementById('go').textContent = st.running ? '⏸ Pausar' : (ms < DUR[st.mode] ? '▶ Seguir' : '▶ Empezar');
    document.getElementById('count').textContent = '🍅 ' + st.count + ' hoy';
  }
  document.getElementById('go').onclick = function () {
    if (st.running) { st.left = remaining(); st.running = false; }
    else { st.endAt = Date.now() + st.left; st.running = true; document.getElementById('msg').innerHTML = MSG[st.mode]; }
    save(st); render();
  };
  document.getElementById('reset').onclick = function () { setMode(st.mode); document.getElementById('msg').innerHTML = MSG[st.mode]; };
  var mb = document.querySelectorAll('.modes button');
  for (var i = 0; i < mb.length; i++) mb[i].onclick = function () { setMode(this.getAttribute('data-m')); document.getElementById('msg').innerHTML = MSG[st.mode]; };

  setInterval(function () { if (st.running && remaining() <= 0) finish(); else render(); }, 500);
  setInterval(renderHello, 60000);
  document.getElementById('msg').innerHTML = MSG[st.mode];
  renderHello(); render();
</script>
</body>
</html>
